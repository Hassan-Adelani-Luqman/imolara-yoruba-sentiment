# Phase 2 baselines (CPU, deterministic). Each experiment grid-searches its hyperparameters on
# CLEAN dev macro-F1 (dev tweets that do not duplicate a training tweet); the selected model is
# then scored on all + clean dev in every diacritic form.
#   python -m src.baselines                      # all experiments
#   python -m src.baselines --only e1c_wordchar_lr

eval_diacritics: [original, no_tones, no_diacritics]

experiments:
  e0_majority:
    model: majority

  e1a_word_lr:              # bag of words/bigrams: the classic baseline
    model: logreg
    features: word
    grid: {C: [1, 3, 10, 30, 100, 300], class_weight: [null, balanced]}

  e1b_char_svm:             # character n-grams: robust to spelling and diacritic variation
    model: linearsvc
    features: char
    grid: {C: [0.03, 0.1, 0.3, 1], class_weight: [null, balanced]}

  e1c_wordchar_lr:          # word + character union: main reported baseline
    model: logreg
    features: word+char
    grid: {C: [1, 3, 10, 30], class_weight: [null, balanced]}

  e1d_wordchar_lr_raw:      # text-style ablation: e1c trained on RAW tweets, scored on normalised dev
    model: logreg
    features: word+char
    train_style: raw
    grid: {C: [0.1, 0.3, 1, 3, 10], class_weight: [null, balanced]}
